# Nightly integration tests against Juju 4.x.
#
# This is a parallel CI pipeline that mirrors the main integration tests in
# tests.yaml but runs with the latest edge Juju 4.x release. It is scheduled
# to run nightly so the team can spot Juju 4 compatibility issues early and
# report them to the Juju team.
#
# Key differences from tests.yaml:
#   - Juju channel: 4/edge  (instead of 3.6/stable)
#   - postgresql-k8s channel: 16/stable  (14/stable does not support juju 4)
#   - postgresql-k8s deployed with force=True to bypass base checks until the
#     charm formally declares Juju 4 support
#
# The regular CI (tests.yaml / Juju 3.x) is NOT affected by this workflow.

name: Nightly Juju 4.x Tests

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering for ad-hoc runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests-juju4:
    name: Integration tests (${{ matrix.test }}) [juju 4.x]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_auth
          - test_charm
          - test_host_info
          - test_pgbouncer
          - test_scaling
          - test_server_upgrade
          - test_upgrades
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install concierge --classic

          sudo concierge prepare \
            -p k8s \
            --juju-channel 4.1/edge \
            --charmcraft-channel 4.x/stable \
            --extra-snaps="astral-uv,just,kubectl"

          sudo k8s kubectl config view --raw > ~/.kube/config

      - name: Run integration tests
        env:
          # postgresql-k8s 14/stable does not support juju 4; use 16/stable
          # with force=True until the charm formally declares juju 4 support.
          POSTGRESQL_CHANNEL: "16/stable"
          POSTGRESQL_FORCE: "true"
        run: just integration tests/integration/${{ matrix.test }}.py

      - name: Upload Juju debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juju-debug-logs-${{ matrix.test }}-juju4
          path: .logs/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state

  # The ingress test needs both a Kubernetes and an LXD controller.
  # concierge-juju4.yaml mirrors concierge.yaml but targets juju 4/edge.
  ingress-integration-test-juju4:
    name: Integration test (ingress) [juju 4.x]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install concierge --classic

          sudo concierge prepare -c .github/workflows/concierge-juju4.yaml

          sudo k8s kubectl config view --raw > ~/.kube/config

      - name: Run ingress integration test
        env:
          POSTGRESQL_CHANNEL: "16/stable"
          POSTGRESQL_FORCE: "true"
        run: just integration tests/integration/test_ingress.py

      - name: Upload Juju debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juju-debug-logs-test_ingress-juju4
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state

  # Track failures from the scheduled nightly run in GitHub issues so the team
  # has a visible, assignable record to triage.  One issue is kept per failing
  # test file (title contains the test name): if a matching open issue already
  # exists the run is added as a comment, otherwise a new issue is created.
  # The `bug` label is required for the Jira sync bot to pick the issue up.
  # Does not fire on workflow_dispatch runs so manual ad-hoc reruns stay
  # noise-free.

  notify-on-failure:
    name: Report nightly failures
    runs-on: ubuntu-latest
    needs: [integration-tests-juju4, ingress-integration-test-juju4]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
      actions: read
    steps:
      - name: Create or update failure issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const date = new Date().toISOString().split('T')[0];
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {
                owner,
                repo,
                run_id: context.runId,
                attempt_number: context.runAttempt,
              },
            );

            // Map failed test jobs to their test files.
            const tests = new Set();

            for (const job of jobs) {
              if (!['failure', 'timed_out'].includes(job.conclusion)) {
                continue;
              }

              const match = job.name.match(/\(([^)]+)\)/);
              if (!match) continue;

              const name = match[1];
              const test = name === 'ingress'
                ? 'test_ingress'
                : name;

              if (test.startsWith('test_')) {
                tests.add(test);
              }
            }

            if (tests.size === 0) {
              core.warning(
                'No failed test jobs identified. Check the workflow run for setup or infrastructure failures.'
              );
              return;
            }

            for (const test of tests) {
              const title = `Juju 4 nightly failure: ${test}.py`;

              const { data: search } =
                await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
                });

              const existing = search.items.find(
                issue => issue.title === title
              );

              const body = [
                `**Date:** ${date}`,
                `**Test file:** \`tests/integration/${test}.py\``,
                `**Workflow run:** ${runUrl}`,
              ].join('\n');

              if (existing) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body: `Nightly failure observed again.\n\n${body}`,
                });

                core.info(`Updated issue #${existing.number}: ${title}`);
              } else {
                const issue = await github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body: [
                    `## Nightly Juju 4 integration failure`,
                    '',
                    body,
                    '',
                    'Please investigate whether this is a charm, Juju,',
                    'dependency, or test infrastructure failure.',
                    '',
                    'Subsequent nightly failures will be added as comments.',
                  ].join('\n'),
                  labels: ['ci-failure', 'juju4', 'bug'],
                });

                core.info(`Created issue #${issue.data.number}: ${title}`);
              }
            }

