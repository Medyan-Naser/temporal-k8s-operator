# Nightly integration tests against Juju 4.x.
#
# This is a parallel CI pipeline that mirrors the main integration tests in
# tests.yaml but runs with the latest stable Juju 4.x release. It is scheduled
# to run nightly so the team can spot Juju 4 compatibility issues early and
# report them to the Juju team.
#
# Key differences from tests.yaml:
#   - Juju channel: 4/stable  (instead of 3.6/stable)
#   - postgresql-k8s channel: 16/stable  (14/stable does not support juju 4)
#   - postgresql-k8s deployed with force=True to bypass base checks until the
#     charm formally declares Juju 4 support
#
# The regular CI (tests.yaml / Juju 3.x) is NOT affected by this workflow.

name: Nightly Juju 4.x Tests

on:
  schedule:
    # Run at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual triggering for ad-hoc runs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests-juju4:
    name: Integration tests (${{ matrix.test }}) [juju 4.x]
    runs-on: [self-hosted-linux-amd64-resolute-large]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        test:
          - test_auth
          - test_charm
          - test_host_info
          - test_pgbouncer
          - test_scaling
          - test_server_upgrade
          - test_upgrades
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install concierge --classic

          sudo concierge prepare \
            -p k8s \
            --juju-channel 4/stable \
            --charmcraft-channel 4.x/stable \
            --extra-snaps="astral-uv,just,kubectl"

          sudo k8s kubectl config view --raw > ~/.kube/config

      - name: Run integration tests
        env:
          # postgresql-k8s 14/stable does not support juju 4; use 16/stable
          # with force=True until the charm formally declares juju 4 support.
          POSTGRESQL_CHANNEL: "16/stable"
          POSTGRESQL_FORCE: "true"
        run: just integration tests/integration/${{ matrix.test }}.py

      - name: Upload Juju debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juju-debug-logs-${{ matrix.test }}-juju4
          path: .logs/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state

  # The ingress test needs both a Kubernetes and an LXD controller.
  # concierge-juju4.yaml mirrors concierge.yaml but targets juju 4/stable.
  ingress-integration-test-juju4:
    name: Integration test (ingress) [juju 4.x]
    runs-on: [self-hosted-linux-amd64-resolute-large]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo snap install concierge --classic

          sudo concierge prepare -c .github/workflows/concierge-juju4.yaml

          sudo k8s kubectl config view --raw > ~/.kube/config

      - name: Run ingress integration test
        env:
          POSTGRESQL_CHANNEL: "16/stable"
          POSTGRESQL_FORCE: "true"
        run: just integration tests/integration/test_ingress.py

      - name: Upload Juju debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juju-debug-logs-test_ingress-juju4
          path: .logs/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Get system state (if failure)
        if: failure()
        run: just get-system-state

  # Open a GitHub issue when the scheduled nightly run has any failures so the
  # team has a visible, assignable record to triage.  Does not fire on
  # workflow_dispatch runs so manual ad-hoc reruns stay noise-free.
  notify-on-failure:
    name: Open issue on nightly failure
    runs-on: ubuntu-latest
    needs: [integration-tests-juju4, ingress-integration-test-juju4]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly Juju 4.x test failure — ${date}`,
              body: [
                '## Nightly Juju 4.x integration tests failed',
                '',
                `**Date:** ${date}`,
                `**Run:** ${runUrl}`,
                '',
                'Please investigate the failed jobs in the run above, determine whether',
                'the failure is in our charm or in a dependency (Juju, postgresql-k8s, etc.),',
                'and triage accordingly.',
                '',
                '> This issue was opened automatically by the nightly CI workflow.',
              ].join('\n'),
              labels: ['ci-failure', 'juju4'],
            });
